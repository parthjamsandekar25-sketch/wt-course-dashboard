<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Learning Course Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="wtsla.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header>
    <nav class="bg-slate-900 text-white">
      <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-lg font-semibold">E-Learning Course Dashboard</h1>
        <button id="back-btn" class="btn btn-secondary hidden">Back to Dashboard</button>
      </div>
      <div class="max-w-6xl mx-auto px-4 pb-4">
        <div id="search-bar" class="flex flex-col sm:flex-row gap-3">
          <input id="search-input" type="search"
                 placeholder="Search by course, section, or subject"
                 class="flex-1 rounded border border-slate-300 px-3 py-2 text-slate-900 bg-white" />
          <select id="subject-filter"
                  class="rounded border border-slate-300 px-3 py-2 bg-white text-slate-900">
            <option value="">All Subjects</option>
          </select>
        </div>
      </div>
    </nav>
  </header>

  <main class="max-w-6xl w-full mx-auto px-4 py-8 flex-1">
    <!-- Dashboard view -->
    <section id="dashboard-section">
      <h2 class="text-xl font-bold mb-1">My Courses</h2>
      <p class="text-sm text-slate-500 mb-6">Progress and quiz scores are tracked for the current browser session only.</p>
      <div id="course-list" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      <p id="no-results" class="text-slate-500 hidden mt-4">No courses match your search or subject filter.</p>
    </section>

    <!-- Course view -->
    <section id="course-section" class="hidden">
      <div class="grid gap-6 lg:grid-cols-[280px,1fr]">
        <aside id="course-tree" class="bg-white rounded border border-slate-200 p-4 self-start"></aside>
        <div>
          <div id="course-progress" class="bg-white rounded border border-slate-200 p-4 mb-6"></div>
          <article id="lesson-content" class="bg-white rounded border border-slate-200 p-4"></article>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-slate-900 text-slate-400 text-sm">
    <div class="max-w-6xl mx-auto px-4 py-3">E-Learning Course Dashboard. Static site project.</div>
  </footer>

  <script src="wtsla.js"></script>
</body>
</html>
